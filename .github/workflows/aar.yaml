name: Build Android AAR

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '25.2.9519653'

      - name: Install CMake and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make build-essential
          sudo ln -sf /usr/bin/cmake /usr/local/bin/cmake
          sudo ln -sf /usr/bin/make /usr/local/bin/make

      - name: Build Code
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653
          export PATH=/usr/local/bin:/usr/bin:/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          
          find . -type f -exec sed -i 's/-Werror//g' {} +
          find . -name "CMakeLists.txt" -exec sed -i '1s/^/add_compile_options(-w)\n/' {} +
          
          ./build.sh android-aar release

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: libzt-android-aar
          path: "**/*.aar"
          
