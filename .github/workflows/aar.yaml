name: Build Android AAR

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '25.2.9519653'

      - name: Build
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          
          # Hapus paksa semua bendera -Werror di seluruh repositori
          find . -type f -exec sed -i 's/-Werror//g' {} +
          
          # Suntikkan instruksi pengabaian semua warning (-w) langsung ke dalam eksekusi cmake di build.sh
          sed -i 's/cmake /cmake -DCMAKE_C_FLAGS="-w" -DCMAKE_CXX_FLAGS="-w" /g' build.sh
          
          # Jalankan kompilasi bersih
          ./build.sh android-aar release

          
      - uses: actions/upload-artifact@v4
        with:
          name: libzt-android-aar
          path: "**/build/outputs/aar/*.aar"
