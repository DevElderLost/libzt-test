name: Build Android AAR

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '25.2.9519653'

      - name: Install CMake and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make build-essential

      - name: Build
        run: |
          # Set lokasi Android Home dan NDK yang dibutuhkan skrip ZeroTier
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          
          # Hapus paksa semua aturan -Werror di seluruh repositori
          find . -type f -exec sed -i 's/-Werror//g' {} +
          
          # Suntikkan pengabaian semua warning (-w) ke perintah cmake di build.sh
          sed -i 's/cmake /cmake -DCMAKE_C_FLAGS="-w" -DCMAKE_CXX_FLAGS="-w" /g' build.sh
          
          # Jalankan kompilasi resmi
          ./build.sh android-aar release

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: libzt-android-aar
          path: "**/*.aar"
          
